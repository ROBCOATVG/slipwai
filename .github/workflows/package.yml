name: package conformance

# What a package's own CI runs — whichever kind it is — as a workflow a package repository calls rather
# than copies.
# The division is theme A's: the keel's gate proves the conformance suite works, against one toy package
# in-tree; each package proves itself against a pinned keel, on its own schedule; and the keel's release
# proves the published packages still pass against what is about to ship (slice 8.4).
#
# A keel that ran every package's gate would be a keel nobody could change without them, which is the
# coupling the packages were split out to remove. So this file lives here to be *reused*, and runs
# nowhere in this repository.
on:
  workflow_call:
    inputs:
      package:
        description: The package's directory name, which is also its name in the chandlery
        required: true
        type: string
      kind:
        description: language, extension or target — which conformance suite proves it
        required: false
        default: language
        type: string
      keel:
        description: >
          The keel to prove against. A bare version is one on PyPI (`2.0.0`); anything else is passed to
          pip as it stands, so `git+https://github.com/owner/repo@main` works for a keel that is not
          published yet. Empty installs `slipwai`, which is right once the version you need is on PyPI.
        required: false
        default: ''
        type: string
      matrix:
        description: Run the generated-variant matrix as well as the conformance suite
        required: false
        default: false
        type: boolean
      beside:
        description: >
          Packages to install beside this one before conformance runs, space-separated. A framework needs
          its family and names it in `language.json`'s `requires`, so that one is worked out and this does
          not have to say it. A *family* is the case this is for: it declares no backend of its own, so the
          suite proves it through one of its frameworks, and which framework is the publisher's to choose —
          `java` names `java-spring`. Empty for a package that stands alone, which is most of them.
        required: false
        default: ''
        type: string
      toolchains:
        description: >
          What the runner needs installed before the matrix runs, space-separated, from `go`, `node`,
          `java`, `uv` and `pack`. The matrix generates a project per row and runs *that project's* own
          `make verify`, so the runner needs the language's own toolchain — which the package knows and
          this workflow cannot: the keel ships no language. Ignored unless `matrix` is true.
        required: false
        default: ''
        type: string
      channel:
        description: >
          The channel to publish into, as `<owner>/<repo>`. On a tag, and only on a tag, a package whose
          conformance passed is built and offered to it. Empty: nothing is published, which is the right
          answer for a fork and for anyone proving a package they do not own.
        required: false
        default: ''
        type: string
    secrets:
      chandlery_token:
        description: >
          A token that may open a pull request on `channel`. Absent, the release is still built and
          attached to the tag — a publisher registers it by hand with one command, and nothing in this
          repository has ever held a credential for somebody else's.
        required: false

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: ${{ inputs.package }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # A pinned keel, named by the package. Pinned and not latest: a package says which keel it was
      # built for in `language.json`, and a CI that silently tracked the newest would turn a keel's
      # release into every package's problem at once.
      - name: Install the keel this package is built for
        run: |
          set -eu
          python -m pip install --disable-pip-version-check "$(
            case "${{ inputs.keel }}" in
              "")      echo slipwai ;;
              [0-9]*)  echo "slipwai==${{ inputs.keel }}" ;;
              *)       echo "${{ inputs.keel }}" ;;
            esac)"
          slipwai --version

      # **A package is proved with whatever it is proved through beside it.** The checkout is one directory
      # under `$PWD` and conformance reads `$PWD`, so without this step a framework meets its own family
      # missing — `requires java >=1.0,<2; java is not loaded` — and a family meets no framework to be
      # checked through. Three of the six published languages were red on exactly that.
      #
      # Into `$PWD` and not the default directory: `SLIPWAI_LANGUAGES` names the one directory the keel
      # looks in, so pointing it here means the sibling lands beside the checkout and the checkout is the
      # copy under test. Installed from the chandlery, which is where a sibling comes from for anybody
      # proving one package on its own.
      - name: Install what this package is proved beside
        if: inputs.kind == 'language'
        run: |
          set -eu
          needed=$(python - "$PWD/${{ inputs.package }}/language.json" <<'PY'
          import json, sys
          try:
              manifest = json.loads(open(sys.argv[1], encoding="utf-8").read())
          except (OSError, ValueError):
              manifest = {}
          requires = manifest.get("requires")
          print(" ".join(sorted(requires)) if isinstance(requires, dict) else "")
          PY
          )
          beside=""
          for word in $needed ${{ inputs.beside }}; do
            # An `if`, not `[ … ] && continue`: under `set -eu` that list exits the step the first time the
            # test is false, which is every sibling that is not this package — so the skip would be the
            # whole step.
            if [ "$word" = "${{ inputs.package }}" ]; then continue; fi
            beside="$beside $word"
          done
          if [ -z "$(printf '%s' "$beside" | tr -d ' ')" ]; then
            echo "nothing to install beside ${{ inputs.package }}; it stands alone"
            exit 0
          fi

          # Installed into the keel's own directory first and copied across after, which is not a
          # roundabout way of doing it — it is the only way. `slipwai install` loads the directory it is
          # installing into, so installing *into* `$PWD` means loading the checkout, and the checkout is a
          # framework whose family is the thing not there yet: the install refuses with the very message it
          # was run to fix. The default directory holds no checkout, so there is nothing half-resolved in it.
          #
          # A family's framework needs the family to load, and here the family is the checkout and not
          # published-and-installed — so the first install can fail for that reason alone, and the retry
          # adds this package's own published copy to satisfy it. Only the siblings are copied across:
          # `$PWD` keeps the checkout as the copy under test.
          echo "installing$beside beside ${{ inputs.package }}"
          # No `--accept-publisher`: that flag is `slipwai extension install`'s, and the language path does
          # not ask about a publisher at all. Passing it is an argument error, not a no-op.
          slipwai install $beside || slipwai install "${{ inputs.package }}" $beside
          for sibling in $beside; do
            rm -rf "$PWD/$sibling"
            cp -R "$HOME/.slipwai/packages/$sibling" "$PWD/$sibling"
          done

      # One suite per kind. A language's asks the package questions and checks the answers; an extension's
      # builds a scratch project, runs the entry point in it, and looks at what happened to the project; a
      # target's reads its declaration, imports its `TARGET` and holds both stacks to the files it ships.
      # A target reaches no cloud here, deliberately: a gate that needed an account is a gate no fork runs.
      - name: Conformance
        run: |
          set -eu
          if [ "${{ inputs.kind }}" = "extension" ]; then
            python -m slipwai.conformance --extension "$PWD/${{ inputs.package }}"
          elif [ "${{ inputs.kind }}" = "target" ]; then
            python -m slipwai.conformance --target "$PWD/${{ inputs.package }}"
          else
            python -m slipwai.conformance "$PWD" "${{ inputs.package }}"
          fi

      # **What the matrix builds a generated project with.** Each is a step because a step is the only
      # thing that can install a toolchain, and each is conditional because a package names only its own.
      # This list is the one place the keel knows a toolchain by name, which is uncomfortable next to
      # "the keel ships no language" — the honest home is the package's own workflow, where its
      # `ci_toolchain_setup` answer already writes exactly these steps for a generated project's CI.
      # Recorded against slice 3.7b rather than left as a surprise.
      - if: inputs.matrix && contains(inputs.toolchains, 'go')
        uses: actions/setup-go@v5
        with:
          go-version: stable
      - if: inputs.matrix && contains(inputs.toolchains, 'node')
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 25, because a generated Java project targets it and an older JDK answers `release version 25 is
      # not supported` — which is what java-quarkus's first matrix run said.
      - if: inputs.matrix && contains(inputs.toolchains, 'java')
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - if: inputs.matrix && contains(inputs.toolchains, 'uv')
        uses: astral-sh/setup-uv@v5
      - if: inputs.matrix && contains(inputs.toolchains, 'pack')
        uses: buildpacks/github-actions/setup-pack@v5.8.11

      # Every generated variant of every backend, each held to its own native gate. Opt-in, because it
      # builds images and starts containers and a package that has not got that far says so. A language's
      # only: an extension writes no skeleton, so it has no variants.
      - name: The generated-variant matrix
        if: ${{ inputs.matrix && inputs.kind == 'language' }}
        run: python -m slipwai.matrix "$PWD" "${{ inputs.package }}"

  # Publishing, and only from a tag. A green run on `main` is a package that works; it is not a package
  # anybody asked for. A tag is somebody saying "this one" — which is the same reason `make release`
  # refuses to invent a version and `package register` refuses to replace one.
  publish:
    needs: conformance
    if: startsWith(github.ref, 'refs/tags/v') && inputs.channel != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write        # to attach the release file to this package's own tag
    steps:
      - uses: actions/checkout@v6
        with:
          path: ${{ inputs.package }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install the keel
        run: |
          set -eu
          python -m pip install --disable-pip-version-check "$(
            case "${{ inputs.keel }}" in
              "")      echo slipwai ;;
              [0-9]*)  echo "slipwai==${{ inputs.keel }}" ;;
              *)       echo "${{ inputs.keel }}" ;;
            esac)"
          slipwai --version

      # Built here rather than taken from the publisher's machine: a release file nobody can reproduce is
      # a release file nobody can check, and this is the one place the bytes and the tag are known to
      # belong to each other.
      - name: Build the release
        id: built
        run: |
          set -eu
          cd "${{ inputs.package }}"
          version="$(cat VERSION)"
          name="${{ inputs.package }}"
          # Where the bytes will be once this job has attached them: the asset on this tag. The channel
          # then holds the entry alone, and git is not asked to keep a copy of every release for ever.
          url="${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/$name-$version.tar.gz"
          slipwai package release . --out ../dist --publisher "${{ github.repository_owner }}" \
            --file-url "$url"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Attach it to the tag
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/entries/*.json

      # The pull request is the whole of publishing: a channel's gate runs on it, a person merges it, and
      # the index is rebuilt from the entry it added. Without a token this step says so and stops, which
      # leaves a release attached to the tag and one command to register it.
      - name: Offer it to ${{ inputs.channel }}
        env:
          GH_TOKEN: ${{ secrets.chandlery_token }}
        run: |
          set -eu
          if [ -z "${GH_TOKEN:-}" ]; then
            printf '%s\n' "no chandlery_token, so nothing was offered to ${{ inputs.channel }}." >&2
            printf '%s\n' "The release is attached to this tag. To publish it:" >&2
            printf '%s\n' "  slipwai package register . --channel <a checkout of ${{ inputs.channel }}>" >&2
            exit 0
          fi
          name="${{ inputs.package }}"
          version="${{ steps.built.outputs.version }}"
          gh repo clone "${{ inputs.channel }}" channel -- --depth 1
          cd channel
          git switch -c "publish-$name-$version"
          slipwai package register "../${{ inputs.package }}" --channel . \
            --publisher "${{ github.repository_owner }}" --file-url "${{ steps.built.outputs.url }}"
          git add -A
          git -c user.email=actions@github.com -c user.name="${{ inputs.package }} release" \
            commit -m "Publish $name $version"
          git push -u origin "publish-$name-$version"
          gh pr create --fill --title "Publish $name $version" \
            --body "Released by $GITHUB_REPOSITORY from the tag \`$GITHUB_REF_NAME\`, with conformance green. The channel's own check runs on this pull request."
