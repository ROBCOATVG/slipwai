name: verify

# The keel's gate, on every platform someone runs `slipwai` from. Version 1's `verify.yml` is a different
# animal — ten jobs on a self-hosted runner, generating a project per backend and holding each to its own
# gate — and none of that applies yet: there are no languages in the keel to generate with. What is here is
# the fast half, which is the half that has to stay fast. The slow jobs come back in phase 6 as per-package
# jobs in the packages' own repositories, not as a matrix here.
on:
  # `push:` unfiltered fires on a pull request branch too, so every commit on an open PR would run this
  # suite twice at the same second. A PR branch is covered by `pull_request`; `push` only has to cover the
  # branch no PR reports on.
  push:
    branches:
      - main
    # A release tag, which `make release` makes and `git push --follow-tags` sends. Its run is the gate on
    # the tagged commit and then the publication, in that order: see `publish` at the bottom.
    tags: ['v*']
  pull_request:

# A second push while the first is still running supersedes it: the older run is testing a commit nobody is
# waiting on any more. `main` is excluded — every commit that lands there gets its own verdict.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  gate:
    # 3.11 is the floor `pyproject.toml` promises, so the gate runs on the floor rather than on whatever is
    # newest: a syntax or a standard-library call that needs 3.12 is a broken promise, and only the floor
    # catches it.
    #
    # Four shards a platform, each a quarter of the test modules (`scripts/test-shard.py`): on one process
    # the suite took 27 minutes on Windows and 13 to 16 elsewhere, and a run is as long as its slowest job.
    # Shard 0 also runs the checks that are not tests, once a platform.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        shard: [0, 1, 2, 3]
    runs-on: ${{ matrix.os }}
    steps:
      # The whole history, not the default shallow one: `scripts/progress.py --check` reads `git log` for
      # the `Slice-done:` trailers that tick the plan's tables, and a one-commit checkout sees none of
      # them, so the gate would call a correct plan wrong. The repository is small; this costs seconds.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # The target packages are submodules, cloned anonymously; the structure gate and the loader
          # both refuse an empty package directory, which is what a checkout without them leaves.
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # On Unix the gate runs as it runs on a laptop, `.python-tools` install and all, because a CI gate
      # that is a different command from the local one is a gate people stop trusting: `make verify` is
      # these checks and `make test`, and the shards are `make test TESTS=…`.
      - if: runner.os != 'Windows'
        run: ./scripts/verify --install-only
      - if: runner.os != 'Windows' && matrix.shard == 0
        run: make lint typecheck check-structure check-shared check-release
      - if: runner.os != 'Windows'
        run: make test TESTS="$(python3 scripts/test-shard.py ${{ matrix.shard }} 4 | tr '\n' ' ')"

      # Windows runs the same checks without make. `make` and a POSIX `scripts/verify` are not a given
      # there, and what Windows has to prove is that *slipwai* works on it, not that the keel's Makefile
      # does — nobody running the command on Windows will ever type `make`.
      - if: runner.os == 'Windows'
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - if: runner.os == 'Windows' && matrix.shard == 0
        run: python -m ruff check src scripts tests
      - if: runner.os == 'Windows' && matrix.shard == 0
        run: python -m compileall -q src scripts tests
      - if: runner.os == 'Windows' && matrix.shard == 0
        run: python -m mypy
      - if: runner.os == 'Windows' && matrix.shard == 0
        run: python scripts/check-structure.py
      - if: runner.os == 'Windows'
        shell: bash
        run: python -m unittest -v $(python scripts/test-shard.py ${{ matrix.shard }} 4 | tr '\r\n' '  ')
        env:
          PYTHONPATH: src;tests

      # The command itself, on every platform: installed the way a user installs it, then asked what it is
      # through both routes. This is the step that catches a packaging mistake the gate above cannot see —
      # a file left out of the wheel, an entry point that does not resolve, a console script that is not on
      # PATH.
      - if: matrix.shard == 0
        run: python -m pip install --disable-pip-version-check -e .
      - if: matrix.shard == 0
        name: The installed command says which keel it is
        shell: bash
        run: |
          set -eu
          expected="slipwai $(cat VERSION)"
          test "$(slipwai --version)" = "$expected"
          test "$(python -m slipwai --version)" = "$expected"
          echo "$expected on ${{ runner.os }}"

  # The guide, run. Its own job rather than a step of the gate: it generates two projects, drives the
  # interview, renders the model through Node and runs a generated project's whole gate, which is a minute
  # or two that the three-platform matrix above has no reason to pay three times. Ubuntu only, for the same
  # reason — a page drifting from the keel is not a per-platform fault.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      # `make model` renders the diagrams through mermaid, and `check-drawio` inside the generated gate
      # needs it too. Without Node the run reports what it skipped rather than passing on less.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # mermaid renders through a headless Chromium, and Chromium's own sandbox cannot initialise on a
      # runner. Without this the page's `make model` output goes unchecked — the gate says so rather than
      # passing, which is how this was found, but a check that is always skipped is not a check.
      - name: Chromium without the sandbox a runner cannot give it
        run: printf '%s' '{"args":["--no-sandbox","--disable-dev-shm-usage"]}' > /tmp/mermaid-puppeteer.json
      - run: make test-docs
        env:
          MERMAID_PUPPETEER_CONFIG: /tmp/mermaid-puppeteer.json

  # A generated project gated the way the board gates it, on every platform a person runs the board from:
  # Make from the machine, or on Windows installed through the board's own installer with Git's bash; every
  # command on the board's PATH (docs/windows-plan.md, 24.11). The Windows app is published because the
  # Windows row is green.
  project:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      # The event-modelling profile's gate checks the model with Node, as it does anywhere.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The Windows runner has GnuWin32's and Strawberry's Make on PATH; the board would use a good copy as
      # it is, so they go, and the Make this proves is the one the board installs.
      - name: No Make but the board's
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $kept = ($env:PATH -split ';') | Where-Object { -not (Test-Path (Join-Path $_ 'make.exe')) }
          "PATH=$($kept -join ';')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: python scripts/project-gate.py

  # A release, built on each platform it ships for and smoked there, from the tagged commit. Only on a tag,
  # and only in this repository: a fork's tag builds nothing, because a fork has no PyPI project to send it to.
  # On a release tag, what `publish` puts out. On every push to main, the same builds as a dev build: kept on
  # the run for a fortnight, published nowhere, and named for main's snapshot version and the commit, so a
  # person can try the app from main without a release and nobody mistakes one for the other.
  distributions:
    if: (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') && github.repository == 'ROBCOATVG/slipwai'
    needs: [gate, docs, project]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
          - os: macos-latest
            name: macos-arm64
          - os: windows-latest
            name: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          persist-credentials: false
          # The tag history, which is what a dev build is numbered from (`scripts/dev-version.py`).
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      # Every build of main was `VERSION`'s `.dev0`, one string for different code; now it is the snapshot that
      # many commits past the last release, written for this build only and never committed.
      - name: Number this dev build
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: python scripts/dev-version.py --write
      - name: The tag is the version the tree carries
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -eu
          test "v$(cat VERSION)" = "$GITHUB_REF_NAME" || {
            echo "::error::$GITHUB_REF_NAME tags a tree whose VERSION is $(cat VERSION); make release writes both"
            exit 1
          }
      # The wheel and source distribution are the same bytes on every platform, so one platform builds the
      # ones that are published; every platform still builds and smokes its own, which is what proves them.
      - name: Build and smoke the wheel
        shell: bash
        run: |
          set -eu
          ./scripts/build-wheel
          for wheel in dist/slipwai-*.whl; do
            python scripts/smoke-wheel.py "$wheel"
          done
      - name: Build and smoke the executable
        shell: bash
        run: |
          set -eu
          ./scripts/build-executable
          suffix=''
          app=''
          if [ "$RUNNER_OS" = Windows ]; then suffix='.exe'; app='--app dist/slipwai-board.exe'; fi
          if [ "$RUNNER_OS" = macOS ]; then app='--app dist/Slipwai.app'; fi
          python scripts/smoke-executable.py "dist/slipwai$suffix" $app
          # A dev build from main carries the commit too: main's VERSION is the next snapshot for every commit.
          version="$(cat VERSION)"
          case "$GITHUB_REF" in refs/tags/v*) ;; *) version="$version-${GITHUB_SHA::7}" ;; esac
          mkdir -p release
          cp "dist/slipwai$suffix" "release/slipwai-$version-${{ matrix.name }}$suffix"
          # The app, for a person with no terminal: a disk image with the bundle and the Applications
          # folder to drag it to on macOS, the one windowed file on Windows (double-click-plan.md, 23.2).
          if [ "$RUNNER_OS" = macOS ]; then
            mkdir -p dmg && cp -R dist/Slipwai.app dmg/ && ln -s /Applications dmg/Applications
            hdiutil create -volname slipwai -srcfolder dmg -ov -format UDZO \
              "release/Slipwai-$version-${{ matrix.name }}.dmg"
          fi
          # Published now that the project job's Windows row makes and gates a project there (windows-plan.md, 24.12).
          if [ "$RUNNER_OS" = Windows ]; then
            cp dist/slipwai-board.exe "release/Slipwai-$version-${{ matrix.name }}.exe"
          fi
          # Every file in release/, by Python and not a shell glob: `slipwai-* Slipwai-*` passed the literal
          # `Slipwai-*` on Linux, which has no app, and on Windows, whose names do not differ by case.
          cd release && python -c "import hashlib,os; [open(p + '.sha256', 'w', newline='\n').write(hashlib.sha256(open(p, 'rb').read()).hexdigest() + '  ' + p + '\n') for p in sorted(os.listdir('.'))]"
      - uses: actions/upload-artifact@v7
        with:
          name: executable-${{ matrix.name }}
          path: release/*
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 90 || 14 }}
      - if: matrix.name == 'linux-x64'
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 90 || 14 }}
          path: |
            dist/slipwai-*.whl
            dist/slipwai-*.tar.gz
          if-no-files-found: error

  # The publication: PyPI by trusted publishing, so no token is stored anywhere — PyPI accepts this job of
  # this workflow in this repository, under the `pypi` environment, and nothing else. Then the GitHub release
  # for the tag, carrying the executables and their checksums. A version is spent the moment PyPI has it, so
  # this runs last, behind every platform's gate and every platform's smoke.
  dev-snapshot:
    # Main's newest build that passed, where anyone can download it: the `dev` prerelease, replaced by every
    # push's run. The run's own artifacts need a GitHub login and are gone in 14 days, and a person trying
    # the app before a release has neither. A prerelease is never `releases/latest`, so the release page's
    # newest stays the newest release.
    if: github.ref == 'refs/heads/main' && github.repository == 'ROBCOATVG/slipwai'
    needs: [distributions]
    runs-on: ubuntu-latest
    # One at a time. Main's runs are never cancelled, so two can finish close together, and the older one is
    # held below to not replacing a newer one rather than to finishing first.
    concurrency:
      group: dev-snapshot
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: executable-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist
      - name: Replace the dev prerelease with this build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # Every build of main that passed replaces the snapshot, so it is always main's newest build
          # that passed. Waiting for main's tip instead left it three merges behind: each run found a
          # newer commit by the time it got here, and published nothing. The one build that stands
          # aside is one older than what is already there, which is two runs finishing out of order.
          held=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/dev" --jq .object.sha 2>/dev/null || true)
          if [ -n "$held" ] && [ "$held" != "$GITHUB_SHA" ]; then
            ahead=$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$held" --jq .status 2>/dev/null || true)
            if [ "$ahead" = "ahead" ]; then
              echo "the snapshot is at $held, which is newer than $GITHUB_SHA: it stays."
              exit 0
            fi
          fi
          short=${GITHUB_SHA:0:7}
          gh release delete dev --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create dev release/* dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "slipwai dev snapshot ($short)" \
            --notes "The newest build of main, at $short, replaced by every push to main: not a release, and not tested beyond main's CI. Releases are the others on this page. On a Mac, download Slipwai (.dmg) and open it: the board opens in your browser. This build is unsigned: the first time, open System Settings > Privacy & Security and press Open Anyway. On Windows, download Slipwai (.exe) and open it; it is unsigned too, so press More info, then Run anyway. Each file has a .sha256 beside it. The changelog.d fragments at $short say what has changed since the last release."

  publish:
    # Its own guard and not only `distributions'`: that job runs on main too now, and a version is spent the
    # moment PyPI has it.
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'ROBCOATVG/slipwai'
    needs: [distributions]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/slipwai/
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist
      - uses: actions/download-artifact@v8
        with:
          pattern: executable-*
          path: release
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: The release, with the executables
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          prerelease=''
          case "$GITHUB_REF_NAME" in *dev*|*a*|*b*|*rc*) prerelease='--prerelease' ;; esac
          gh release create "$GITHUB_REF_NAME" release/* dist/* --repo "$GITHUB_REPOSITORY" \
            --title "slipwai ${GITHUB_REF_NAME#v}" --verify-tag $prerelease \
            --notes "No terminal? On a Mac, download Slipwai (.dmg) and open it: the board opens in your browser. This build is unsigned: the first time, open System Settings > Privacy & Security and press Open Anyway. On Windows, download Slipwai (.exe) and open it; it is unsigned too, so press More info, then Run anyway. Otherwise install with \`pip install slipwai==${GITHUB_REF_NAME#v}\` or download the executable for your platform below. Each has a .sha256 beside it. CHANGELOG.md has what changed."
