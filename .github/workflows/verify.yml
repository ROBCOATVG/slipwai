name: verify

# The keel's gate, on every platform someone runs `slipwai` from. Version 1's `verify.yml` is a different
# animal — ten jobs on a self-hosted runner, generating a project per backend and holding each to its own
# gate — and none of that applies yet: there are no languages in the keel to generate with. What is here is
# the fast half, which is the half that has to stay fast. The slow jobs come back in phase 6 as per-package
# jobs in the packages' own repositories, not as a matrix here.
on:
  # `push:` unfiltered fires on a pull request branch too, so every commit on an open PR would run this
  # suite twice at the same second. A PR branch is covered by `pull_request`; `push` only has to cover the
  # branch no PR reports on.
  push:
    branches:
      - main
  pull_request:

# A second push while the first is still running supersedes it: the older run is testing a commit nobody is
# waiting on any more. `main` is excluded — every commit that lands there gets its own verdict.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  gate:
    # 3.11 is the floor `pyproject.toml` promises, so the gate runs on the floor rather than on whatever is
    # newest: a syntax or a standard-library call that needs 3.12 is a broken promise, and only the floor
    # catches it.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # The whole history, not the default shallow one: `scripts/progress.py --check` reads `git log` for
      # the `Slice-done:` trailers that tick the plan's tables, and a one-commit checkout sees none of
      # them, so the gate would call a correct plan wrong. The repository is small; this costs seconds.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # The target packages are submodules, cloned anonymously; the structure gate and the loader
          # both refuse an empty package directory, which is what a checkout without them leaves.
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # On Unix the gate runs exactly as it runs on a laptop, `.python-tools` install and all, because a CI
      # gate that is a different command from the local one is a gate people stop trusting.
      - if: runner.os != 'Windows'
        run: make verify

      # Windows runs the same four checks without make. `make` and a POSIX `scripts/verify` are not a given
      # there, and what Windows has to prove is that *slipwai* works on it, not that the keel's Makefile
      # does — nobody running the command on Windows will ever type `make`.
      - if: runner.os == 'Windows'
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - if: runner.os == 'Windows'
        run: python -m ruff check src scripts tests
      - if: runner.os == 'Windows'
        run: python -m compileall -q src scripts tests
      - if: runner.os == 'Windows'
        run: python -m mypy
      - if: runner.os == 'Windows'
        run: python scripts/check-structure.py
      # The loop suite on its own first. The whole run's summary is where a failure's message is printed,
      # and a run interrupted before its end prints none; this suite's verdict is on the log either way.
      - if: runner.os == 'Windows'
        run: python -m unittest -v test_loop
        env:
          PYTHONPATH: src;tests
        continue-on-error: true
      - if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src

      # The command itself, on every platform: installed the way a user installs it, then asked what it is
      # through both routes. This is the step that catches a packaging mistake the gate above cannot see —
      # a file left out of the wheel, an entry point that does not resolve, a console script that is not on
      # PATH.
      - run: python -m pip install --disable-pip-version-check -e .
      - name: The installed command says which keel it is
        shell: bash
        run: |
          set -eu
          expected="slipwai $(cat VERSION)"
          test "$(slipwai --version)" = "$expected"
          test "$(python -m slipwai --version)" = "$expected"
          echo "$expected on ${{ runner.os }}"

  # The guide, run. Its own job rather than a step of the gate: it generates two projects, drives the
  # interview, renders the model through Node and runs a generated project's whole gate, which is a minute
  # or two that the three-platform matrix above has no reason to pay three times. Ubuntu only, for the same
  # reason — a page drifting from the keel is not a per-platform fault.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      # `make model` renders the diagrams through mermaid, and `check-drawio` inside the generated gate
      # needs it too. Without Node the run reports what it skipped rather than passing on less.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # mermaid renders through a headless Chromium, and Chromium's own sandbox cannot initialise on a
      # runner. Without this the page's `make model` output goes unchecked — the gate says so rather than
      # passing, which is how this was found, but a check that is always skipped is not a check.
      - name: Chromium without the sandbox a runner cannot give it
        run: printf '%s' '{"args":["--no-sandbox","--disable-dev-shm-usage"]}' > /tmp/mermaid-puppeteer.json
      - run: make test-docs
        env:
          MERMAID_PUPPETEER_CONFIG: /tmp/mermaid-puppeteer.json
