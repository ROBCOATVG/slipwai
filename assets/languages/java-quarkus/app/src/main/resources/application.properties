# Quarkus configuration. Values come from the environment (twelve-factor); the `${NAME:default}` form
# names the variable and the local fallback in one line, so `.env.example` and this file cannot drift into
# disagreeing about which variable is read.
# backing-service:quarkus-rest|postgres|sqlite|keycloak|users-keycloak:begin
#
# Each block between `backing-service:<name>:begin` and `:end` belongs to one selected option, and
# `scripts/backing-services.py` removes it along with the dependency in `pom.xml` that reads it.
# backing-service:quarkus-rest|postgres|sqlite|keycloak|users-keycloak:end

quarkus.banner.enabled=false

# How often a scheduled catch-up pass runs, where this project has projections to run. This is the
# lag this project accepts on an `async` read model — the whole cost of that answer, in one number — so it
# is a property an operator can turn down under load rather than a constant somebody has to rebuild.
#
# It costs almost nothing while no projection is registered: a pass with no beans to run returns without
# touching the database. A project whose read models are all `live` or `inline` can leave it alone.
projections.every=${PROJECTIONS_EVERY:1s}

# The production image's base, for `make build` (the Jib extension in pom.xml). Temurin 25 on Ubuntu, the
# same JDK vendor the CI image and `actions/setup-java` install, rather than Quarkus's Red Hat UBI default —
# one vendor everywhere this service runs. Inert until `-Dquarkus.container-image.build=true` asks for it.
quarkus.jib.base-jvm-image=eclipse-temurin:25-jre-noble

# Dev Services off, explicitly, and this is the single most important line in the file.
#
# Left on, Quarkus starts a throwaway container for any datasource, broker or identity provider it finds
# unconfigured — convenient, and directly at odds with this repository's rule that `make verify` runs with
# no Docker at all. Off, an unconfigured datasource is a configuration error you can see, which is what it
# should be. Prove it the honest way: stop the Docker daemon and run `make verify`.
quarkus.devservices.enabled=false

# A random free port for `@QuarkusTest`, rather than the default 8081. A fixed test port is machine-global:
# the moment this project's own Keycloak container publishes 8081 locally, `make verify` and `make demo`
# stop being runnable at the same time, and the failure reads as a broken test.
quarkus.http.test-port=0

# backing-service:quarkus-rest:begin
# HOST defaults to 0.0.0.0 rather than localhost because this process runs inside a container as often as
# beside you, and a server bound to 127.0.0.1 in a container is reachable from nothing: the published port
# answers, the connection is refused, and no log line says why. Bind narrowly in a real environment by
# setting HOST there, where the network is known.
quarkus.http.host=${HOST:0.0.0.0}
quarkus.http.port=${PORT:3000}

# SmallRye Health serves the readiness probe, which is why no `/health` route is written by hand anywhere
# in this project. A leading slash makes the path absolute rather than relative to `/q`, so the probe every
# other backend here answers on is the probe this one answers on too — the Compose healthcheck, `make
# demo`'s printed URL and `skills/run-the-app` all name it.
#
# The *body* is MicroProfile Health's, and that is not configurable: `{"status":"UP","checks":[...]}`
# rather than this repository's `{"status":"ok"}`. That difference is the price of a probe somebody else
# maintains, and it is the right price.
quarkus.smallrye-health.root-path=/health
# backing-service:quarkus-rest:end

# backing-service:postgres:begin
# The event store. The JDBC URL, username and password are derived from `DATABASE_URL` by
# `config/DatabaseUrlConfigSource.java` — one variable, the same one every other backend in this factory
# reads — so the values below are only the local fallback for when it is unset.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/app
quarkus.datasource.username=app
quarkus.datasource.password=app

# Migrations are applied by `make migrate`, never at start-up. Writing to a database is an explicit act,
# and a service that migrates as it boots migrates once per replica during a rolling deploy.
quarkus.flyway.migrate-at-start=false
quarkus.flyway.locations=db/migration

# Agroal registers a readiness check for every datasource on its own — for free, and it is the right thing
# to have on once this service actually depends on the store. It is off here because it is not true yet.
#
# Nothing in a freshly generated project reads the event store: the adapter exists, no slice wires it, and
# the datasource is configured only because the extension is present. Left on, `/health` would report DOWN
# wherever the database is not reachable — which is `make verify` by design, and `make demo` too, since the
# app is not given the container's address until something needs it. A probe that is red while the service
# is working is a probe people learn to ignore.
#
# Turn this on in the same change that wires the store into a use case, and give the service the store's
# address at the same time — inside the Compose network that is `postgres:5432`, not the `localhost:5433`
# the host publishes.
quarkus.datasource.health.enabled=false
# backing-service:postgres:end

# backing-service:sqlite:begin
# Where the SQLite event log lives. A path, not a URL: SQLite is a file this process opens, with no server
# to address. Deleting it deletes the entire truth of an event-sourced system.
event-store.sqlite.path=${EVENT_STORE_PATH:./events.sqlite3}
# backing-service:sqlite:end

# backing-service:keycloak:begin
# Staff identity. `quarkus-oidc` performs the whole Authorization Code flow with PKCE, validates the ID
# token against the issuer's JWKS, and checks `iss`, `aud`, `exp` and `nonce`. None of that is written in
# this repository, and none of it should be.
#
# Disabled until a route needs a principal, and that is a deliberate default rather than an oversight.
# Enabled, the extension fetches the issuer's discovery document while starting, so the service would
# refuse to boot whenever Keycloak is not up — for a project where no route requires authentication yet,
# that is a hard dependency bought for nothing. Set this to true in the same change that adds the first
# `@RolesAllowed`, and read `skills/secure-oauth-oidc/SKILL.md` before that change.
quarkus.oidc.tenant-enabled=false
quarkus.oidc.auth-server-url=${OIDC_ISSUER:http://localhost:8081/realms/app}
quarkus.oidc.client-id=${OIDC_CLIENT_ID:app-local}
quarkus.oidc.credentials.secret=${OIDC_CLIENT_SECRET:local-only-not-a-real-secret}
quarkus.oidc.application-type=service

# The claim the groups arrive in. Keycloak's group-membership mapper writes `groups`; Cognito writes
# `cognito:groups`. `KeycloakGroupRoleAugmentor` reads whichever this names, so the mapping below is the
# same mapping against either issuer.
app.oidc.groups-claim=${OIDC_GROUPS_CLAIM:groups}

# The groups this realm grants, read by `adapters/driving/http/auth/KeycloakRoles.java`. Roles are yours to
# name — an authorisation model is a product decision, and these three are the local fixture in
# `docker/keycloak/realms/app.json`, not a prescription.
app.oidc.group.admin=${OIDC_GROUP_ADMIN:app-admin}
app.oidc.group.operator=${OIDC_GROUP_OPERATOR:app-operator}
app.oidc.group.viewer=${OIDC_GROUP_VIEWER:app-viewer}
# backing-service:keycloak:end

# backing-service:users-keycloak:begin
# Customer identity: a second realm, `customers`, in the same Keycloak container as the staff realm `app`,
# configured as a second, named `quarkus-oidc` tenant. Same container because a second Keycloak buys
# nothing locally; separate realms because staff and customers share no accounts, no groups and no login
# page, and a realm is the unit Keycloak isolates those at. The fixtures are
# `docker/keycloak/realms/app.json` (staff) and `docker/keycloak/realms/customers.json` (customers).
#
# The browser app performs the Authorization Code flow with PKCE against this realm and sends the access
# token as a bearer token; this service is a resource server for it — `application-type=service` — and the
# extension validates the token's signature, `iss`, `aud` and `exp`. None of that is written here.
#
# Disabled until a route needs a customer, for the same reason as the staff tenant above: enabled, the
# extension fetches this realm's discovery document while starting and the service refuses to boot without
# Keycloak. Set this to true in the same change that adds the first customer route.
quarkus.oidc.customers.tenant-enabled=false
quarkus.oidc.customers.auth-server-url=${USERS_OIDC_ISSUER:http://localhost:8081/realms/customers}
quarkus.oidc.customers.client-id=${USERS_OIDC_AUDIENCE:api}
quarkus.oidc.customers.application-type=service

# A token is accepted only if it was minted for this API. Keycloak puts an audience on a token through a
# client scope, which the `customers` realm fixture configures; without this line a token for any client in
# the realm would pass.
quarkus.oidc.customers.token.audience=${USERS_OIDC_AUDIENCE:api}

# Which requests this tenant authenticates, by path. A starting convention rather than a decision: change
# it in the same change that adds the first customer route. Anything not under it falls to the default
# (staff) tenant, so a staff token on a customer route and a customer token on a staff route each fail their
# tenant's issuer check.
quarkus.oidc.customers.tenant-paths=/api/customers/*

# The issuer `adapters/driving/http/users/CurrentCustomer.java` insists on, exactly. Two realms in one
# Keycloak means a staff token is a valid JWT whose issuer differs from a customer's by one path segment;
# the extension checks the issuer per tenant, and `CustomerIdentity` checks it again in code this project
# tests. Customers have no groups: there is no mapping to configure, and what a customer may do is a
# use-case rule.
app.users.oidc.issuer=${USERS_OIDC_ISSUER:http://localhost:8081/realms/customers}
# backing-service:users-keycloak:end
