# Spring Boot configuration. Values come from the environment (twelve-factor); the `${NAME:default}` form
# names the variable and the local fallback in one line, so `.env.example` and this file cannot drift into
# disagreeing about which variable is read.
# backing-service:spring-web|postgres|sqlite|keycloak|users-keycloak:begin
#
# Each block between `backing-service:<name>:begin` and `:end` belongs to one selected option, and
# `scripts/backing-services.py` removes it along with the dependency in `pom.xml` that reads it.
# backing-service:spring-web|postgres|sqlite|keycloak|users-keycloak:end

spring.main.banner-mode=off
spring.application.name=delivery-starter-service

# How often a scheduled catch-up pass runs, where this project has projections to run. This is the
# lag this project accepts on an `async` read model — the whole cost of that answer, in one number — so it
# is a property an operator can turn down under load rather than a constant somebody has to rebuild.
#
# Milliseconds, because that is what `@Scheduled(fixedDelayString = ...)` reads. It costs almost nothing
# while no projection is registered: a pass with no beans to run returns without touching the database. A
# project whose read models are all `live` or `inline` can leave it alone.
projections.every-ms=${PROJECTIONS_EVERY_MS:1000}

# Development-time services off, explicitly, and this is the single most important line in the file.
#
# Spring Boot starts a throwaway container for an unconfigured datasource, broker or identity provider when
# `spring-boot-docker-compose` or Testcontainers is on the classpath — convenient, and directly at odds
# with this repository's rule that `make verify` runs with no Docker at all. Neither is a dependency in
# `pom.xml`, so this line is a guard rather than the switch itself: it is what makes the intent survive
# whoever adds the dependency later. Off, an unconfigured datasource is a configuration error you can see,
# which is what it should be. Prove it the honest way: stop the Docker daemon and run `make verify`.
spring.docker.compose.enabled=false

# backing-service:spring-web:begin
# Address defaults to 0.0.0.0 rather than localhost because this process runs inside a container as often
# as beside you, and a server bound to 127.0.0.1 in a container is reachable from nothing: the published
# port answers, the connection is refused, and no log line says why. Bind narrowly in a real environment by
# setting HOST there, where the network is known.
server.address=${HOST:0.0.0.0}
server.port=${PORT:3000}

# Requests on virtual threads, which is what makes blocking straight-line code the correct style in an
# adapter here rather than a scalability problem. Java 25 is well past the 21 this needs.
spring.threads.virtual.enabled=true

# No static-resource handler, because this is a JSON API and serves no files. That is a security decision
# as much as a tidiness one: left on, the resource handler is mapped to every path, so an unclaimed URL is
# answered by *it* rather than by nothing — and it accepts GET and HEAD only, which means a POST to a path
# that does not exist comes back 405 instead of 404. A probe learns from that difference that something is
# mapped there. Off, nothing claims an unmatched path under any verb and `NotFoundAdvice` answers every one
# of them identically. Turn it back on only alongside somewhere real to serve files from.
spring.web.resources.add-mappings=false

# Actuator serves the readiness probe, which is why no `/health` route is written by hand anywhere in this
# project. The base path moves the endpoints off `/actuator` so the probe every other backend here answers
# on is the probe this one answers on too — the Compose healthcheck, `make demo`'s printed URL and
# `skills/run-the-app` all name it.
#
# Only `health` is exposed. The rest of Actuator is genuinely useful and none of it is free: `env`,
# `configprops` and `heapdump` disclose configuration and memory to whoever can reach them, so they are
# opted into per endpoint in the change that also decides who may reach this port.
#
# The *body* is Actuator's, and that is the price of a probe somebody else maintains:
# `{"status":"UP"}` rather than this repository's `{"status":"ok"}`. Details stay hidden — the default, and
# the right one, since a per-component breakdown of what this service depends on is not something an
# unauthenticated caller needs.
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# backing-service:spring-web:end

# backing-service:postgres:begin
# The event store. The JDBC URL, username and password are derived from `DATABASE_URL` by
# `config/DatabaseUrlEnvironmentPostProcessor.java` — one variable, the same one every other backend in
# this factory reads — so the values below are only the local fallback for when it is unset.
spring.datasource.url=jdbc:postgresql://localhost:5433/app
spring.datasource.username=app
spring.datasource.password=app

# Migrations are applied by `make migrate`, never at start-up. Writing to a database is an explicit act,
# and a service that migrates as it boots migrates once per replica during a rolling deploy. The Flyway
# starter is still a dependency: it is what puts a managed Flyway on the classpath for `MigrateMain` to
# call, and what would apply the migrations if this line were ever flipped.
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration

# Actuator registers a readiness contributor for every datasource on its own — for free, and it is the
# right thing to have on once this service actually depends on the store. It is off here because it is not
# true yet.
#
# Nothing in a freshly generated project reads the event store: the adapter exists, no slice wires it, and
# the datasource is configured only because the starter is present. Left on, `/health` would report DOWN
# wherever the database is not reachable — which is `make verify` by design, and `make demo` too, since the
# app is not given the container's address until something needs it. A probe that is red while the service
# is working is a probe people learn to ignore.
#
# Turn this on in the same change that wires the store into a use case, and give the service the store's
# address at the same time — inside the Compose network that is `postgres:5432`, not the `localhost:5433`
# the host publishes.
management.health.db.enabled=false
# backing-service:postgres:end

# backing-service:sqlite:begin
# Where the SQLite event log lives. A path, not a URL: SQLite is a file this process opens, with no server
# to address. Deleting it deletes the entire truth of an event-sourced system.
event-store.sqlite.path=${EVENT_STORE_PATH:./events.sqlite3}
# backing-service:sqlite:end

# backing-service:keycloak:begin
# Staff identity. Spring Security retrieves the issuer's JWKS, verifies each bearer token's signature and
# checks `iss`, `aud` and `exp`. None of that is written in this repository, and none of it should be.
#
# The issuer is commented out, and the comment is the switch rather than an omission. Setting this property
# is what makes Spring Boot build a `JwtDecoder`, and building one fetches the issuer's discovery document
# while starting — so with it set, the service would refuse to boot whenever Keycloak is not up. For a
# project where no route requires authentication yet, that is a hard dependency bought for nothing.
#
# Uncomment it in the same change that adds the first authorization rule to `SecurityConfig`, and read
# `skills/secure-oauth-oidc/SKILL.md` before that change. Until then `SecurityConfig` leaves every route
# open, and the group mapping below is wired and tested with nothing running.
#spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER:http://localhost:8081/realms/app}

# The claim the groups arrive in. Keycloak's group-membership mapper writes `groups`; Cognito writes
# `cognito:groups`. `SecurityConfig` reads whichever this names, so the mapping below is the same mapping
# against either issuer.
app.oidc.groups-claim=${OIDC_GROUPS_CLAIM:groups}

# The groups this realm grants, read by `adapters/driving/http/auth/KeycloakRoles.java`. Roles are yours to
# name — an authorisation model is a product decision, and these three are the local fixture in
# `docker/keycloak/realms/app.json`, not a prescription.
app.oidc.group.admin=${OIDC_GROUP_ADMIN:app-admin}
app.oidc.group.operator=${OIDC_GROUP_OPERATOR:app-operator}
app.oidc.group.viewer=${OIDC_GROUP_VIEWER:app-viewer}
# backing-service:keycloak:end

# backing-service:users-keycloak:begin
# Customer identity: a second realm, `customers`, in the same Keycloak container as the staff realm `app`.
# Same container because a second Keycloak buys nothing locally; separate realms because staff and
# customers share no accounts, no groups and no login page, and a realm is the unit Keycloak isolates those
# at. The fixtures are `docker/keycloak/realms/app.json` (staff) and `docker/keycloak/realms/customers.json`
# (customers).
#
# The browser app performs the Authorization Code flow with PKCE against this realm and sends the access
# token as a bearer token; `CustomerSecurityConfig` validates it on the customer routes with a decoder built
# for this issuer — signature, `iss`, `aud` and `exp` — and none of that is written in this repository.
#
# The issuer is commented out, and the comment is the switch, for the same reason as the staff one above:
# building a decoder fetches the issuer's discovery document while starting, so with it set the service
# refuses to boot whenever Keycloak is not up. Uncomment it in the same change that adds the first customer
# route. Until then the customer chain permits everything under its matcher, and the rules in
# `adapters/driving/http/users/CustomerIdentity.java` are wired and tested with nothing running. It is this
# project's own property rather than Spring Boot's `issuer-uri`, because that one produces the staff decoder.
#app.users.oidc.issuer-uri=${USERS_OIDC_ISSUER:http://localhost:8081/realms/customers}

# A token is accepted only if it was minted for this API. Keycloak puts an audience on a token through a
# client scope, which the `customers` realm fixture configures; without this check a token for any client in
# the realm would pass. Customers have no groups: there is no mapping to configure, and what a customer may
# do is a use-case rule.
app.users.oidc.audience=${USERS_OIDC_AUDIENCE:api}
# backing-service:users-keycloak:end
