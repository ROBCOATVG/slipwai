<svg viewBox="0 0 1500 820" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="How language and extension packages, the chandlery, the keel and a product repository link: what crosses the package boundary and who publishes">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
<marker id="ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahhl"/></marker>
</defs>
<style>
svg{color:#172129;font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.box{fill:#fff;stroke:#73828c;stroke-width:1}.box.hl{fill:#dcecea;stroke:#0f6b6b;stroke-width:1.5}.box.dash{stroke-dasharray:4 3;fill:#f4f6f7}
.band{fill:#eef2f4;stroke:#d7dee2}.bandt{fill:#73828c;font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;letter-spacing:.04em}
.bar{fill:#f1e9d2;stroke:#8a6d24}.trunk{fill:#dcecea;stroke:#0f6b6b;stroke-width:1.2}
text{fill:#172129}.lbl{fill:#44525c}.arr{stroke:#172129;stroke-width:1.2;fill:none}.arr.hl{stroke:#0f6b6b;stroke-width:1.6}.arr.dash{stroke-dasharray:4 3}
#ah path{fill:#172129}.ahhl{fill:#0f6b6b}
</style>
<rect class="box " x="30" y="40" width="330" height="170" rx="3"/>
<text x="195.0" y="73.2" text-anchor="middle" font-size="12" font-weight="600">A product repository</text>
<text x="195.0" y="89.2" text-anchor="middle" font-size="12">generated or adopted</text>
<text x="195.0" y="105.2" text-anchor="middle" font-size="12"></text>
<text x="195.0" y="121.2" text-anchor="middle" font-size="12">project.json records:</text>
<text x="195.0" y="137.2" text-anchor="middle" font-size="12">generator.generatedWith = keel version</text>
<text x="195.0" y="153.2" text-anchor="middle" font-size="12">generator.languages = {java: 2.1.0,</text>
<text x="195.0" y="169.2" text-anchor="middle" font-size="12">  java-quarkus: 2.1.0}</text>
<text x="195.0" y="185.2" text-anchor="middle" font-size="12">.slipwai/extensions.json</text>
<rect class="box hl" x="520" y="40" width="460" height="170" rx="3"/>
<text x="750.0" y="73.2" text-anchor="middle" font-size="12" font-weight="600">The keel  (slipwai itself)</text>
<text x="750.0" y="89.2" text-anchor="middle" font-size="12">the questions: profiles, targets, frontends, axes</text>
<text x="750.0" y="105.2" text-anchor="middle" font-size="12">the scaffold pipeline · the toolkit · adoption · the loop</text>
<text x="750.0" y="121.2" text-anchor="middle" font-size="12"></text>
<text x="750.0" y="137.2" text-anchor="middle" font-size="12">registry: one object per backend, answers by Member</text>
<text x="750.0" y="153.2" text-anchor="middle" font-size="12">loader: a directory per package, whole or absent</text>
<text x="750.0" y="169.2" text-anchor="middle" font-size="12">catalogue merge · conformance suite · matrix runner</text>
<text x="750.0" y="185.2" text-anchor="middle" font-size="12">chandlery client</text>
<rect class="box hl" x="1120" y="40" width="350" height="80" rx="3"/>
<text x="1295.0" y="68.2" text-anchor="middle" font-size="12" font-weight="600">Chandlery · public channel</text>
<text x="1295.0" y="84.2" text-anchor="middle" font-size="12">index.json: name · version · core range</text>
<text x="1295.0" y="100.2" text-anchor="middle" font-size="12">sha256 · publisher identity · signature</text>
<rect class="box hl" x="1120" y="130" width="350" height="80" rx="3"/>
<text x="1295.0" y="158.2" text-anchor="middle" font-size="12" font-weight="600">Chandlery · an organisation&#x27;s channel</text>
<text x="1295.0" y="174.2" text-anchor="middle" font-size="12">SLIPWAI_LANGUAGE_INDEX → its own index.json</text>
<text x="1295.0" y="190.2" text-anchor="middle" font-size="12">same shape, private packages</text>
<path class="arr " d="M 980,80 L 1120,80" marker-end="url(#ah)"/>
<text class="lbl" x="1050.0" y="70" text-anchor="middle" font-size="11">asks: what fits core 9.x?</text>
<path class="arr " d="M 1120,100 L 980,100" marker-end="url(#ah)"/>
<text class="lbl" x="1050.0" y="118" text-anchor="middle" font-size="11">release file → staged → sha256 → atomic rename</text>
<path class="arr " d="M 1120,170 L 980,170" marker-end="url(#ah)"/>
<text class="lbl" x="1050.0" y="188" text-anchor="middle" font-size="11">same verbs, different index</text>
<path class="arr " d="M 520,90 L 360,90" marker-end="url(#ah)"/>
<text class="lbl" x="440.0" y="80" text-anchor="middle" font-size="11">generate · add-service · init</text>
<text class="lbl" x="440" y="106" font-size="11" text-anchor="middle">files from the keel's questions</text>
<text class="lbl" x="440" y="120" font-size="11" text-anchor="middle">and the languages' answers</text>
<path class="arr " d="M 360,150 L 520,150" marker-end="url(#ah)"/>
<text class="lbl" x="440.0" y="170" text-anchor="middle" font-size="11">migrate: reads the record,</text>
<text class="lbl" x="440" y="184" font-size="11" text-anchor="middle">installs what is missing, refuses</text>
<text class="lbl" x="440" y="198" font-size="11" text-anchor="middle">an incompatible pair before writing</text>
<line x1="30" y1="266" x2="1470" y2="266" stroke="currentColor" stroke-dasharray="6 4" stroke-width="1.2"/>
<text x="1470" y="282" font-size="11" class="bandt" text-anchor="end">THE PACKAGE BOUNDARY · only data and a protocol cross it</text>
<path class="arr " d="M 560,210 L 560,300" marker-end="url(#ah)"/>
<text class="lbl" x="552" y="232" text-anchor="end" font-size="11">import surface: 20 modules</text>
<text class="lbl" x="552" y="246" font-size="11" text-anchor="end">held by check-structure</text>
<path class="arr " d="M 380,210 L 380,300" marker-end="url(#ah)"/>
<text class="lbl" x="372" y="232" text-anchor="end" font-size="11">conformance + matrix</text>
<text class="lbl" x="372" y="246" font-size="11" text-anchor="end">run in the package's CI</text>
<path class="arr " d="M 200,210 L 200,300" marker-end="url(#ah)"/>
<text class="lbl" x="192" y="232" text-anchor="end" font-size="11">markers.json</text>
<text class="lbl" x="192" y="246" font-size="11" text-anchor="end">every {{example:}} answered</text>
<path class="arr " d="M 720,300 L 720,210" marker-end="url(#ah)"/>
<text class="lbl" x="728" y="232" text-anchor="start" font-size="11">language.json fragment</text>
<text class="lbl" x="728" y="246" font-size="11" text-anchor="start">merged into the catalogue</text>
<path class="arr " d="M 900,300 L 900,210" marker-end="url(#ah)"/>
<text class="lbl" x="908" y="232" text-anchor="start" font-size="11">LANGUAGE object answers Members:</text>
<text class="lbl" x="908" y="246" font-size="11" text-anchor="start">tooling, image, layouts, flags, prune rows</text>
<rect class="band" x="16" y="290" width="1468" height="300" rx="4"/><text class="bandt" x="28" y="307" font-size="11">PACKAGES · each its own repository, version, changelog and CI · installed into ~/.slipwai/packages/&lt;name&gt;, or into a project by ./init</text>
<text x="30" y="332" font-size="11" class="bandt">LANGUAGES · a family holds what every backend of the language shares · a framework owns startup and depends on its family</text>
<rect class="box " x="30" y="346" width="150" height="70" rx="3"/>
<text x="105.0" y="369.2" text-anchor="middle" font-size="12" font-weight="600">typescript</text>
<text x="105.0" y="385.2" text-anchor="middle" font-size="12">family = leaf</text>
<text x="105.0" y="401.2" text-anchor="middle" font-size="12">core &gt;=9,&lt;10</text>
<rect class="box " x="200" y="346" width="150" height="70" rx="3"/>
<text x="275.0" y="369.2" text-anchor="middle" font-size="12" font-weight="600">python</text>
<text x="275.0" y="385.2" text-anchor="middle" font-size="12">family = leaf</text>
<text x="275.0" y="401.2" text-anchor="middle" font-size="12">core &gt;=9,&lt;10</text>
<rect class="box " x="370" y="346" width="150" height="70" rx="3"/>
<text x="445.0" y="369.2" text-anchor="middle" font-size="12" font-weight="600">go</text>
<text x="445.0" y="385.2" text-anchor="middle" font-size="12">family = leaf</text>
<text x="445.0" y="401.2" text-anchor="middle" font-size="12">core &gt;=9,&lt;10</text>
<rect class="box " x="560" y="346" width="170" height="70" rx="3"/>
<text x="645.0" y="369.2" text-anchor="middle" font-size="12" font-weight="600">java  (family)</text>
<text x="645.0" y="385.2" text-anchor="middle" font-size="12">Maven, adapters, examples</text>
<text x="645.0" y="401.2" text-anchor="middle" font-size="12">generates nothing alone</text>
<rect class="box " x="560" y="470" width="170" height="70" rx="3"/>
<text x="645.0" y="493.2" text-anchor="middle" font-size="12" font-weight="600">java-quarkus</text>
<text x="645.0" y="509.2" text-anchor="middle" font-size="12">framework</text>
<text x="645.0" y="525.2" text-anchor="middle" font-size="12">requires java &gt;=1,&lt;2</text>
<rect class="box " x="760" y="470" width="170" height="70" rx="3"/>
<text x="845.0" y="493.2" text-anchor="middle" font-size="12" font-weight="600">java-spring</text>
<text x="845.0" y="509.2" text-anchor="middle" font-size="12">framework</text>
<text x="845.0" y="525.2" text-anchor="middle" font-size="12">requires java &gt;=1,&lt;2</text>
<path class="arr " d="M 645,470 L 645,416" marker-end="url(#ah)"/>
<text class="lbl" x="636" y="438" text-anchor="end" font-size="11">inherits the family&#x27;s answers,</text>
<text class="lbl" x="636" y="452" font-size="11" text-anchor="end">may import the family's Python</text>
<path class="arr " d="M 845,470 L 845,448 L 730,448 L 730,416" marker-end="url(#ah)"/>
<rect class="box dash" x="760" y="346" width="170" height="70" rx="3"/>
<text x="845.0" y="369.2" text-anchor="middle" font-size="12" font-weight="600">a Gradle sibling</text>
<text x="845.0" y="385.2" text-anchor="middle" font-size="12">framework · anyone&#x27;s</text>
<text x="845.0" y="401.2" text-anchor="middle" font-size="12">overrides tooling only</text>
<text x="980" y="332" font-size="11" class="bandt">EXTENSIONS · dev tooling · extension.json + init.py</text>
<rect class="box " x="980" y="346" width="150" height="70" rx="3"/>
<text x="1055.0" y="369.2" text-anchor="middle" font-size="12" font-weight="600">codegraph</text>
<text x="1055.0" y="385.2" text-anchor="middle" font-size="12">init.py contract</text>
<text x="1055.0" y="401.2" text-anchor="middle" font-size="12">never touches the skeleton</text>
<rect class="box " x="1150" y="346" width="150" height="70" rx="3"/>
<text x="1225.0" y="369.2" text-anchor="middle" font-size="12" font-weight="600">uipro</text>
<text x="1225.0" y="385.2" text-anchor="middle" font-size="12">init.py contract</text>
<text x="1225.0" y="401.2" text-anchor="middle" font-size="12">a skill pack</text>
<rect class="box " x="1320" y="346" width="150" height="70" rx="3"/>
<text x="1395.0" y="369.2" text-anchor="middle" font-size="12" font-weight="600">ux-gates</text>
<text x="1395.0" y="385.2" text-anchor="middle" font-size="12">init.py contract</text>
<text x="1395.0" y="401.2" text-anchor="middle" font-size="12">gates beside verify</text>
<rect class="box dash" x="1150" y="470" width="320" height="70" rx="3"/>
<text x="1310.0" y="493.2" text-anchor="middle" font-size="12" font-weight="600">slipwai package new → check → release → register</text>
<text x="1310.0" y="509.2" text-anchor="middle" font-size="12">the template, filled in by the interview</text>
<text x="1310.0" y="525.2" text-anchor="middle" font-size="12">all of add-module and add-extension, in four verbs</text>
<path class="arr " d="M 1150,505 L 930,505" marker-end="url(#ah)"/>
<text class="lbl" x="1040.0" y="522" text-anchor="middle" font-size="11">becomes a new language</text>
<path class="arr " d="M 1310,470 L 1310,416" marker-end="url(#ah)"/>
<text class="lbl" x="1318" y="446" text-anchor="start" font-size="11">or a new extension</text>
<text x="30" y="632" font-size="11" class="bandt">PUBLISHERS · whoever holds the repository cuts the release; a chandlery lists it</text>
<rect class="box " x="30" y="648" width="330" height="90" rx="3"/>
<text x="195.0" y="673.2" text-anchor="middle" font-size="12" font-weight="600">First party</text>
<text x="195.0" y="689.2" text-anchor="middle" font-size="12">ROBCOATVG/slipwai-language-*</text>
<text x="195.0" y="705.2" text-anchor="middle" font-size="12">make release in the package repository</text>
<text x="195.0" y="721.2" text-anchor="middle" font-size="12">listed on the public channel</text>
<rect class="box " x="400" y="648" width="360" height="90" rx="3"/>
<text x="580.0" y="673.2" text-anchor="middle" font-size="12" font-weight="600">An organisation</text>
<text x="580.0" y="689.2" text-anchor="middle" font-size="12">its own packages, its own channel</text>
<text x="580.0" y="705.2" text-anchor="middle" font-size="12">SLIPWAI_LANGUAGE_INDEX in every developer&#x27;s shell</text>
<text x="580.0" y="721.2" text-anchor="middle" font-size="12">never leaves the organisation</text>
<rect class="box " x="800" y="648" width="330" height="90" rx="3"/>
<text x="965.0" y="673.2" text-anchor="middle" font-size="12" font-weight="600">Anyone</text>
<text x="965.0" y="689.2" text-anchor="middle" font-size="12">from the template, in their own repository</text>
<text x="965.0" y="705.2" text-anchor="middle" font-size="12">signed release + a pull request to the index</text>
<text x="965.0" y="721.2" text-anchor="middle" font-size="12">confirmed once by each person who installs</text>
<path class="arr " d="M 195,648 L 195,590" marker-end="url(#ah)"/>
<text class="lbl" x="203" y="622" text-anchor="start" font-size="11">releases</text>
<path class="arr " d="M 580,648 L 580,590" marker-end="url(#ah)"/>
<text class="lbl" x="588" y="622" text-anchor="start" font-size="11">releases</text>
<path class="arr " d="M 965,648 L 965,590" marker-end="url(#ah)"/>
<text class="lbl" x="973" y="622" text-anchor="start" font-size="11">releases</text>
<path class="arr hl " d="M 1130,693 L 1138,693 L 1138,226 L 1490,226 L 1490,80 L 1472,80" marker-end="url(#ah-hl)"/>
<text class="lbl" x="1150" y="612" text-anchor="start" font-size="11">pull request → checks pass → listed</text>
<path class="arr hl dash" d="M 580,738 L 580,756 L 1146,756 L 1146,238 L 1300,238 L 1300,212" marker-end="url(#ah-hl)"/>
<text class="lbl" x="580" y="772" font-size="11" text-anchor="middle">an organisation publishes to its own channel</text>
<text x="30" y="804" font-size="11" class="bandt">Two compatibility ranges, both declared by the package and checked before anything is written: package → core (schemaVersion 9.x) and framework → family. The keel never names a language.</text>
</svg>