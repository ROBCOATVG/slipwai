# The keel as a pip-installable package. `slipwai` is the one console command; the wheel carries `VERSION`
# beside the package as `slipwai/_bundle/`, which is where the keel looks when it finds no checkout around
# it. The version is the `VERSION` file, read rather than repeated.
#
# Version 2 ships the keel alone: `assets/` and `catalog.json` beside `VERSION`, and no language — the
# languages and extensions that version 1 bundled are packages now, installed into `~/.slipwai/packages/`
# from the chandlery rather than carried in this wheel. `CHANGELOG.md` and `changelog.d/` are carried
# because `slipwai upgrade` prints the entries between the version you had and the one you got, and
# `migrate` takes its catch-up notes out of them: an installed keel has no checkout to read either from.
[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "slipwai"
dynamic = ["version"]
description = "One-shot scaffolder for product monorepos: a walking skeleton, a verify gate, a path to production, and a repository set up for coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
# The toolkit's vendored skills carry their own licences and are declared here again when phase 5 brings
# `assets/toolkit/` back. A glob that matches nothing is a build error, so the list holds what exists.
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Volaris Group" }]
dependencies = []

# The one extra, and what it buys. A Sigstore bundle is X.509 and ECDSA, and the standard library has
# neither — so the public channel's keyless signatures are verified through the real library or not at
# all, and a keel without it says `unverified` rather than pretending (plan 6.5, decided 2026-10-08). A
# private channel needs none of this: its releases are Ed25519, which `slipwai/ed25519.py` verifies on
# every machine. Nothing in the keel imports `sigstore` at module scope, so an install without the extra
# is an install that works.
[project.optional-dependencies]
verify = ["sigstore>=3.6.1,<4"]

[project.urls]
Homepage = "https://github.com/ROBCOATVG/slipwai"
Repository = "https://git.treyco.dev/ROBCOATVG/slipwai"
Issues = "https://github.com/ROBCOATVG/slipwai/issues"
Changelog = "https://github.com/ROBCOATVG/slipwai/blob/main/CHANGELOG.md"

[project.scripts]
slipwai = "slipwai.cli:main"

[tool.hatch.version]
path = "VERSION"
pattern = '^(?P<version>\S+)\s*$'

[tool.hatch.build.targets.wheel]
packages = ["src/slipwai"]

[tool.hatch.build.targets.wheel.force-include]
"VERSION" = "slipwai/_bundle/VERSION"
"catalog.json" = "slipwai/_bundle/catalog.json"
"assets" = "slipwai/_bundle/assets"
"CHANGELOG.md" = "slipwai/_bundle/CHANGELOG.md"
"changelog.d" = "slipwai/_bundle/changelog.d"
# `migrate` applies the committed rename table to a version 1 project, and reads it from beside the keel.
"docs/rename.json" = "slipwai/_bundle/docs/rename.json"

# The source distribution is what the wheel is built from, so it needs the same files and nothing of the
# keel's own tests, docs or CI.
[tool.hatch.build.targets.sdist]
# Anchored to the root: unanchored, `VERSION` would also match a worktree's copy under .claude/.
include = ["/src/slipwai", "/assets", "/catalog.json", "/VERSION", "/CHANGELOG.md", "/changelog.d",
           "/docs/rename.json", "/README.md", "/LICENSE", "/NOTICE", "/pyproject.toml"]
exclude = ["**/__pycache__"]

[tool.ruff]
target-version = "py311"
# Wider than the 100 a generated Python project gets, for one reason: this codebase's job is to hold the
# text of other projects' files, and a line of somebody else's Makefile or YAML cannot be rewrapped to suit
# this repository's margin without changing what gets generated.
line-length = 120
extend-exclude = [".python-tools", ".build-tools", "build", "dist", "assets"]

[tool.ruff.lint]
# The same rule set a generated Python project is held to.
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["slipwai"]

[tool.ruff.lint.per-file-ignores]
# Embedded file content: the strings in these modules are other projects' files — a generated Makefile,
# a workflow, a table in somebody's AGENTS.md — and a line inside one of them is as long as that file
# needs it to be. Rewrapping it to suit this repository's margin changes what gets generated. Every
# other rule still applies here, and a long line that is this repository's own prose rather than a
# generated file's content is still worth wrapping by hand.
"src/slipwai/project/*.py" = ["E501"]

[tool.mypy]
# What `make typecheck` runs. `files` rather than arguments so the gate and a bare `mypy` agree; `mypy_path`
# so a script or a test that imports `slipwai` resolves it from `src/` the way `PYTHONPATH=src` does at run
# time. 3.11 because that is the floor this keel promises.
python_version = "3.11"
# One platform's view, on every platform. `cli_prompts` imports `termios` and `tty` behind a try/except
# because raw-mode reading is POSIX only and Windows asks the typed question instead; typeshed marks both
# modules POSIX-only, so mypy run *on* Windows reports five attribute errors for code that never executes
# there. Checking one view keeps the gate the same question wherever it runs, and the Windows leg still
# runs the suite, which is what actually proves the guard — a type checker cannot.
platform = "linux"
files = ["src", "scripts", "tests"]
mypy_path = "src"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

# The one optional import. `slipwai[verify]` pulls `sigstore` and `trust.py` imports it inside the function
# that uses it, so a keel without the extra runs — which is the whole point of its being an extra. The gate
# installs no optional dependency, so without this mypy reports a missing stub for a module it is not
# supposed to find.
[[tool.mypy.overrides]]
module = ["sigstore.*"]
ignore_missing_imports = true
