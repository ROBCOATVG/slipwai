# Game Finder, as the run that produced it modelled it: 39 slices in one context, `finding`, on one
# service. Condensed from a generated project's docs/event-model/model.yaml — ids, names, actors, streams,
# reads and frame names, with the screen data and mock-up links left out — and kept exactly as that run
# left it, context included, because this fixture is the characterisation case for finding seams.
#
# One vocabulary across the whole of it: account, listing, seat, community and feedback mean one thing
# each, and the language test alone found one context. Four streams, five actors, and views that fold
# three streams at once is what the seams script has to surface from it, so that the rule proposes more
# than `finding` here and still leaves a one-stream model as one candidate (tests/test_seams.py).
version: 1
render:
  lanes:
    ui: actor
    data: none
    events: stream
# Added after the run, and the one thing that was: `check-model` now asks every placed stream to state the
# invariant that makes it one, and a characterisation fixture that failed its own model gate would prove
# nothing about the seams script. Each is the reason the run's own decisions gave for the stream.
streams:
  account: {because: an account is opened once and forgotten once, and nothing is written to it after}
  listing: {because: a listing's accepted seats never exceed its chairs, and chairs shrink only while empty}
  community: {because: a member joins once and is removed once, under the community's house rules}
  feedback: {because: feedback is left once per seat per night, inside the night's feedback window}
