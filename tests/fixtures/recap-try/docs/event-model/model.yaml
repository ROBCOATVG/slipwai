      - { type: pcr, name: AdoptServerProgress, data: "maps the server's seconds and last update to a position with a time; skipped when the server is unreachable (the last synced position stands)" }
      - { type: cmd, name: AdoptServerPosition, data: "bookId, position 5:10:00, at 2026-10-20T19:02:11Z; refused when older than the position held" }
      # The contract LB9 sets (specs/001-audiobook-recap/contracts/LB9-server-syncs.md): position is the server's
      # currentTime floored to the second; lastListened is the server's lastUpdate as given, the book's
      # last-listened time (D27); syncedAt is the service's now (D33); syncId is the Player's key per open. No
      # listener, server item, URL, token or isFinished (ADR 0004, IX, D44). A position equal to the one held is in
      # step and records nothing (D43).
      - type: evt
