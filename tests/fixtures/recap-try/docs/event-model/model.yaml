      - { type: pcr, name: RecapWriter, data: "refuses when coverage falls short of the position (FR-009); drafts from the window alone, never given the title or author (FR-003), to the tier's length with the Just now 25% / Recent 35% / Middle 25% / Early 15% gradient (FR-005, FR-006), ending on the moment at the position (FR-007); a second pass strips every sentence naming a person, place or event absent from the window (FR-004) — what survives is spoken, never padded or redrafted (D5); speaks it in the book's voice; a provider error, timeout or rate limit fails the request rather than refusing it (FR-042)" }
      - { type: cmd, name: GenerateRecap, data: "bookId, tier Standard, position 4:03:17; refused when that key is already generated, so two runs cannot both generate" }
      - { type: evt, name: RecapGenerated, data: "bookId, tier Standard, position 4:03:17, 448 words, bands Early · Middle · Recent · Just now, 2 sentences stripped by the spoiler check, ends: Marcus is standing at the Harbourmaster's door and someone inside has just said his name, audio 3:00 in voice Tomas, generatedAt" }
      - { type: evt, name: RecapRefused, data: "bookId, tier Standard, position 4:03:17, reason: prepared to chapter 8 and you are in chapter 9 | nothing to recap in the first minute | no transcript and no text for this book | nothing survived the spoiler check, refusedAt" }
      - { type: evt, name: RecapFailed, data: "bookId, tier Standard, position 4:03:17, cause: the drafting provider timed out | the speech provider rate-limited, failedAt — Couldn't catch you up right now, Retry | Skip; nothing partial spoken or cached (FR-042)" }

