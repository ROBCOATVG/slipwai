# ─────────────────────────────────────────────────────────────────────────────────────────────────────
# The global event model. One file, for the life of the project.
#
# This is the source of truth for the diagram, not the diagram itself: `make model` generates
# model.mmd, model.svg, one view per slice, and model.html from what is here, and `make model-drawio`
# writes model.drawio — the one rendering that is committed, and that `make check-drawio` holds
# current on every commit. Never edit any of those.
#
# Read docs/event-model/README.md before an entry. The five-minute version:
#
#   • Slice order in this file is timeline order. Order within `frames` is causal order.
#   • Frame numbers are derived. Never write one.
#   • Every slice is exactly one of four patterns, and `make check-model` holds you to its shape:
#       state-change   ui|pcr → cmd → evt+          the only way state changes
#       state-view     rmo → ui?                    plus `reads`: the events it folds
#       automation     rmo → pcr → cmd → evt+       plus `reads`: what triggers it
#       translation    evt(external) → pcr → cmd → evt+
#   • optional `depends_on: [OtherSlice]` — genuine build deps only; needing another
#     slice's events is solved with synthetic fixtures, not by waiting for it. Cycles and
#     "depends_on equals the producers of my reads" fail `make check-model`
#   • status walks proposed → modelled → planned → implemented, and each step commits to more:
#       planned      every slice must name the `capability` it is part of — the chunk of work a person's
#                    demo is of, shared by several slices, because a demo of one slice is a demo of a
#                    form that saves something and nobody can tell from it whether the thing works.
#                    A state-change slice must also name what its append is guarded by — its `stream`,
#                    or a `guard` drawn over tags; a state-view or automation slice must
#                    name its `materialisation` — live, inline or async — and a `live` one the
#                    `liveBudget` that bounds the fold it does on every query. An event may also name
#                    its `attributes` here, marking which of them identify something (`identifies:
#                    seat`), which is what a tagging function is transcribed from
#       implemented  `gwt` and `code` must exist, and the events must appear in the source
#
# This model was written from specs/001-audiobook-recap/spec.md and the storyboard its mock-ups stage
# approved (specs/001-audiobook-recap/mockups/). Every worked example below — The Cartographer's
# Silence, Chapter 14 at 32:10, nine days away, Marcus at the Harbourmaster's door — is taken from
# those drawings, so a reader can hold the diagram against the screen it came from. The copies under
# docs/event-model/mockups/ are the same seven files, placed where the published page can serve them.
#
# `reads` names the earlier events that trigger or feed a slice; `folds` names the events on the
# slice's own stream its decision is made from. The two are different questions (README, *reads and
# folds are different questions*), and an automation's todo list is a persisted read model whichever
# way it is invoked.
# ─────────────────────────────────────────────────────────────────────────────────────────────────────

version: 1

render:
  # What each band's swimlanes group by. A namespace is resolved per band, so these are independent —
  # which is how the notation's own picture works: actors across the top, streams across the bottom.
  #   ui      actor | context | none    the ui and pcr boxes; `actor` gives a processor its own lane too
  #   data    context | none            the cmd and rmo boxes
  #   events  stream | context | none   the evt boxes; `stream` names the lane after the slice's `stream`
  #                                     with its placeholder removed, so order-{orderId} is the `order`
  #                                     lane. A slice guarding with `guard` falls back to its `context`.
  # `make model` patches mermaid-cli's copy of mermaid (mermaid-js/mermaid#7986) until it ships the fix
  # for #7925; pasting model.mmd into mermaid.live duplicates lanes until then.
  lanes:
    ui: actor
    data: context
    events: stream
  # How wide a README segment may get, in frames. The timeline grows sideways forever and the column it is
  # read in does not, so the README embeds segments of whole slices rather than one image of everything.
  # Six is about two slices, which renders at ~70–80% in a README column. Lower it to 3 for one slice per
  # image; raise it if your readers always click through to full size. Only used while `page` is unset.
  framesPerSegment: 6
  # Where event-model.yml publishes the browsable page. Read it off the deploy job's environment URL after
  # the first successful run; a README link that 404s is worse than no link.
  page: http://localhost:3301/your-owner/recap/

# ─────────────────────────────────────────────────────────────────────────────────────────────────────
# Streams. Each is one expected-version check, so everything on it is serialised for ever; `because`
# names the decision that needs that, by requirement, after the interrogation nine-steps.md Step 9 asks
# for (specs/001-audiobook-recap/decisions.md, D1, has the interrogation and the seam tests). Groups of
# slices share a stream only where a decision reads them together, or a closure one sets and all must
# check; where nothing spans two groups they are separate streams correlated by id.
# ─────────────────────────────────────────────────────────────────────────────────────────────────────
streams:
  preparation:
    because: "one transcription per content hash — a second import of identical audio must see that preparation for its hash has already started, so nothing is transcribed twice (FR-023, US2 #6); chapters are transcribed in order and the audio is discarded only once every chapter is transcribed, a closure the transcription group sets and the discard group checks (FR-020, FR-024)"
  book:
    because: "an EPUB is aligned against the chapters this import detected, by title and ordinal, in one decision over both (FR-021, FR-022); a server book's audio is fetched once (FR-029, FR-023)"
  listening:
    because: "the later-timed position wins — a report from the player, an entry by hand or the server's progress is adopted only if it is later than the position held, which needs that position still while deciding (FR-028, edge case: two devices); the gap an offer names is measured from the last-listened time held here (FR-011, US6 #2); progress is pushed to the server once per position it has not seen (US6 #3)"
  connection:
    because: "a listener has one Audiobookshelf connection at a time; renewing a rejected token replaces it rather than adding a second, and nothing is pushed through a connection that has lapsed (FR-029, US6 #5)"
  settings:
    because: "one settings record per listener, last write wins — a form the listener edits, with no decision made against it (FR-035, A3)"
  catch-up:
    because: "a recap at one tier and one position is generated at most once — two requests at the same key must not both generate, so the second must see the first (FR-008, US1 #7); an offer is answered, by a request or a decline, at most once (FR-011, SC-003); a recap is heard and rated against one that was generated (FR-007, FR-037); the voice chosen for a book applies to every later recap and answer for it (FR-034)"
  question:
    because: "a question is answered or refused exactly once, against the position it was asked at (FR-014, FR-015)"
  spoiler-report:
    because: "a report is recorded once and nothing decides against it afterwards (FR-038, SC-002) — a stream of one event, correlated by id to the recap, answer or entry it names"

slices:

  # ═══════════════════════════════════════════════════════════════════════════════════════════════════
  # library — the listener's own books, where they are in each, their server and their settings
  # ═══════════════════════════════════════════════════════════════════════════════════════════════════

