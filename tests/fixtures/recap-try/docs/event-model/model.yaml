    frames:
      - type: ui
        name: Player
        data: "pause, the sleep timer elapsing, the app closing — the player reports where it stopped"
        mockups:
          - { state: shown, at: docs/event-model/mockups/player.html }
          - { state: playing, at: docs/event-model/mockups/player-playing.html }
          - { state: stopping, at: docs/event-model/mockups/player-stopping.html }
          - { state: stopped, at: docs/event-model/mockups/player-stopped.html }
          - { state: refused, at: docs/event-model/mockups/player-stop-refused.html }
          - { state: unreachable, at: docs/event-model/mockups/player-stop-unreachable.html }
      - { type: cmd, name: StopListening, data: "bookId, stopId (the idempotency key), position 2:14:09, at 2026-10-12T22:41:03Z; refused when an earlier-timed report arrives after a later one" }
      # The contract LB7 sets (specs/001-audiobook-recap/slices/LB7/examples.md): position 2:14:09 is 8049 s;
      # stoppedAt is the command's `at`, the book's last-listened time (FR-028, D27); the same shape as LB6's
