      - apps/recap-web/src/entry-client.ts
      - apps/recap-web/src/routes/Player.tsx
    frames:
      - type: ui
        name: ManualPosition
        data: "chapter 12, 20 minutes in → Chapter 12 · 20:00 shown before confirming; Set position on the Player's control strip (D36); not drawn — the storyboard's manual-position gap card (FR-030, P1 follow-on)"
        mockups:
          - { state: closed, at: docs/event-model/mockups/lb8-closed.html }
          - { state: form, at: docs/event-model/mockups/lb8-form.html }
          - { state: setting, at: docs/event-model/mockups/lb8-setting.html }
          - { state: set, at: docs/event-model/mockups/lb8-set.html }
          - { state: refused, at: docs/event-model/mockups/lb8-refused.html }
          - { state: unreachable, at: docs/event-model/mockups/lb8-unreachable.html }
      - { type: cmd, name: EnterPosition, data: "bookId, entryId (the idempotency key), chapter 12, 20 whole minutes, at 2026-10-21T20:00:00Z — the moment the listener confirmed; refused beyond-chapter when the minutes exceed the chapter's length, no-such-chapter outside 1..N (D35)" }
      # The contract LB8 sets (specs/001-audiobook-recap/slices/LB8/examples.md): position is the chapter's start plus
      # the minutes, in seconds — chapter 12 at 3:21:00 plus 20:00 is 13260 s (3:41:00), read from the book's chapters
      # on book-{bookId}; enteredAt is the command's `at`, the book's last-listened time (FR-028, D27); the same shape
      # as LB6's ListeningResumed and LB7's ListeningStopped — seconds, an instant, a caller-minted key — so every
      # writer of the stream folds alike. The chapter and minutes are not carried: every reader folds a position.
      - type: evt
        name: PositionEntered
        attributes:
          - { name: bookId, identifies: book }
          - { name: entryId, identifies: entry }
          - { name: position, type: seconds }
          - { name: enteredAt, type: instant }

  - id: LB1
    name: Connect to an Audiobookshelf server
    pattern: state-change
    status: implemented
    actor: Listener
    service: recap-api
    context: library
    capability: audiobookshelf-companion
    stream: connection-{listenerId}
    folds: [ServerConnected]
    spec: specs/001-audiobook-recap/spec.md
    gwt: specs/001-audiobook-recap/slices/LB1/examples.md
    code:
      - apps/recap-api/src/domain/library/events/server-connected.ts
      - apps/recap-api/src/domain/library/server-url.ts
      - apps/recap-api/src/domain/library/connection.ts
