      - apps/recap-api/src/adapters/driven/listener-credentials-postgres.ts
      - apps/recap-api/migrations/202610221411_listener_credentials.js
      - apps/recap-web/src/connection-client.ts
      - apps/recap-web/src/routes/ConnectServer.tsx
    frames:
      - type: ui
        name: ServerConnection
        data: "URL https://books.home.lan, token pasted; not drawn — the storyboard's audiobookshelf-connect gap card"
        mockups:
          - { state: not-connected, at: docs/event-model/mockups/connect-server-not-connected.html }
          - { state: connecting, at: docs/event-model/mockups/connect-server-connecting.html }
          - { state: connected, at: docs/event-model/mockups/connect-server-connected.html }
          - { state: refused, at: docs/event-model/mockups/connect-server-refused.html }
          - { state: unreachable-service, at: docs/event-model/mockups/connect-server-unreachable-service.html }
      - { type: cmd, name: ConnectServer, data: "listenerId, connectionId (the idempotency key), url https://books.home.lan, token — proved against the server before anything is recorded; refused token-rejected | server-unreachable | not-audiobookshelf with no events" }
      # The contract LB1 sets (specs/001-audiobook-recap/slices/LB1/examples.md): the listener as the token's
      # `sub` and nothing else about them (ADR 0004), a caller-minted key, the server's URL as given, and the
      # instant from the command's `at`. No token — a credential is held behind a port, never in an event
      # (constitution IX) — and no book count (D38: what the server lists is LB4's live read).
      - type: evt
        name: ServerConnected
        attributes:
          - { name: listenerId, identifies: listener }
          - { name: connectionId, identifies: connection }
          - { name: serverUrl, type: url }
          - { name: connectedAt, type: instant }

