    frames:
      - type: ui
        name: AddBook
        data: "Import audio files — M4B, MP3 or M4A from this phone or a synced folder"
        mockups:
          - { state: shown, at: docs/event-model/mockups/add-book.html }
          - { state: importing, at: docs/event-model/mockups/add-book-importing.html }
          - { state: imported, at: docs/event-model/mockups/add-book-imported.html }
          - { state: refused, at: docs/event-model/mockups/add-book-refused.html }
      - { type: cmd, name: ImportBook, data: "listenerId, bookId, 3 M4B files in the files' own order — tags, then names (D20); title and author from the file tags — the first tagged file's, the file's name where none is titled, no author where none is named (D21)" }
      - { type: evt, name: BookImported, data: "bookId, listenerId, Nine Winters at Halvard, R. Okafor (optional), 31 chapters from the file metadata (or one segment when it has none; a chapter's title optional), 14h 20m, audioHash sha256:… over the files' bytes in that order, importedAt" }

  - id: LB6
    name: Resume listening
    pattern: state-change
    status: implemented
    actor: Listener
    service: recap-api
    # D32 (decided by the person, 2026-10-21): positions belong to catch-up. `context` below still reads
    # `library` because check-model's one-stream-one-context rule holds every writer of listening-{bookId}
    # to one context, so LB6–LB10 move together on `main` — the host's change — and not one block at a time.
    context: library
    capability: track-position
    stream: listening-{bookId}
    folds: [ListeningResumed, ListeningStopped, PositionEntered, PositionSyncedFromServer]
    spec: specs/001-audiobook-recap/spec.md
    gwt: specs/001-audiobook-recap/slices/LB6/examples.md
    code:
      - apps/recap-api/src/adapters/driven/authenticate-oidc-userinfo.ts
      - apps/recap-api/src/adapters/driven/clock-system.ts
      - apps/recap-api/src/adapters/driven/ids-crypto.ts
      - apps/recap-api/src/adapters/driving/http/bearer.ts
      - apps/recap-api/src/adapters/driving/http/library/resumptions.ts
      - apps/recap-api/src/application/library/book-owner.ts
      - apps/recap-api/src/application/library/ports/authenticate.ts
      - apps/recap-api/src/application/library/public.ts
      - apps/recap-api/src/application/library/resume-listening.ts
      - apps/recap-api/src/application/ports/book-ownership.ts
      - apps/recap-api/src/application/ports/clock.ts
      - apps/recap-api/src/application/ports/ids.ts
      - apps/recap-api/src/domain/library/events.ts
      - apps/recap-api/src/domain/library/events/listening-resumed.ts
      - apps/recap-api/src/domain/library/events/listening-stopped.ts
      - apps/recap-api/src/domain/library/events/listening-stream.ts
      - apps/recap-api/src/domain/library/events/position-entered.ts
      - apps/recap-api/src/domain/library/events/position-synced-from-server.ts
      - apps/recap-api/src/domain/library/listening/decide.ts
      - apps/recap-api/src/domain/library/listening/gap.ts
      - apps/recap-api/src/domain/library/listening/state.ts
      - apps/recap-api/src/domain/shared/instant.ts
      - apps/recap-api/src/domain/shared/resumption-id.ts
      - apps/recap-api/src/domain/shared/seconds.ts
      - apps/recap-web/src/resume-client.ts
      - apps/recap-web/src/routes/Player.tsx
    frames:
      - type: ui
        name: Player
        data: "The Cartographer's Silence · Chapter 14 · The Harbourmaster · 32:10 · Play; or, for a connected book played in Audiobookshelf, opening it in Recap — the return in companion mode (D7)"
        mockups:
          - { state: shown, at: docs/event-model/mockups/player.html }
          - { state: idle, at: docs/event-model/mockups/player-idle.html }
          - { state: resuming, at: docs/event-model/mockups/player-resuming.html }
          - { state: resumed, at: docs/event-model/mockups/player-resumed.html }
          - { state: refused, at: docs/event-model/mockups/player-refused.html }
      - { type: cmd, name: ResumeListening, data: "bookId, resumptionId (the idempotency key), position 4:03:17, at 2026-10-21T07:12:00Z, via the player | opening the book" }
      # The contract LB6 sets (specs/001-audiobook-recap/slices/LB6/examples.md): position 4:03:17 is 14597 s;
      # daysSinceLastListened is whole 24-hour periods from the latest instant the stream held (D13, D27) and
      # absent on a first play; via is `player` or `opening` (the companion-mode return, D7).
      - type: evt
        name: ListeningResumed
        attributes:
          - { name: bookId, identifies: book }
          - { name: resumptionId, identifies: resumption }
          - { name: position, type: seconds }
          - { name: resumedAt, type: instant }
          - { name: daysSinceLastListened, type: "days, absent on a first play" }
          - { name: via, type: "player | opening" }

