    frames:
      - { type: rmo, name: ChaptersToTranscribe, data: "per preparation, the next chapter in order; with prepare-ahead off, only up to a little past the furthest position any listener of this hash has reached (FR-027)" }
      - { type: pcr, name: TranscribeInOrder, data: "word-level timestamps for one chapter; resumes from the next untranscribed chapter after a crash or a lost connection (US2 #3); after retries, a chapter that cannot be transcribed — or a first chapter not in English (D15, FR-044) — fails the preparation at that chapter (D10, FR-020)" }
      - { type: cmd, name: TranscribeChapter, data: "audioHash sha256:…, chapter 9" }
      - { type: evt, name: ChapterTranscribed, data: "audioHash, chapter 9 of 31, 4,812 words with timestamps, covers 3:58:40 to 4:27:05 — recap works up to chapter 9 so far" }
      - { type: evt, name: PreparationCompleted, data: "audioHash, 31 of 31 chapters transcribed, completedAt — with the last chapter only" }
      - { type: evt, name: ChapterTranscriptionFailed, data: "audioHash, chapter 9 of 31, reason: the transcription provider rejected the audio after 3 attempts | the book is not in English, failedAt — recap works up to chapter 8; retry from the library; audio discarded 7 days on (FR-020, FR-024)" }

